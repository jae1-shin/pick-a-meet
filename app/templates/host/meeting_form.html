{% extends "base.html" %}
{% block title %}내 모임 수정 · Pick a Meet{% endblock %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">HOST</p><h1>내 모임 수정</h1></div><a href="/host">내 모임으로</a></div>
  <section class="card form-card">
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div class="form-grid">
        <label>장소<input name="place_name" value="{{ target.place_name }}" required></label>
        <label>장소 바로가기 링크<input name="place_url" type="url" placeholder="https://map.naver.com/..." value="{{ target.place_url or '' }}"></label>
        <label>동네<input name="neighborhood" value="{{ target.neighborhood }}" required></label>
        <label>대표 메뉴<input name="representative_menu" value="{{ target.representative_menu }}" required></label>
        <label>시작 일시<input name="start_at" type="datetime-local" value="{{ target.start_at.astimezone(seoul).strftime('%Y-%m-%dT%H:%M') }}" required></label>
        <label>정원<input name="capacity" type="number" min="{{ applied_count if applied_count > 0 else 1 }}" value="{{ target.capacity }}" required><small class="muted">현재 신청 {{ applied_count }}명보다 작게 설정할 수 없습니다.</small></label>
      </div>
      <label>호스트의 한마디<textarea name="host_message" rows="3" required>{{ target.host_message }}</textarea></label>
      <button type="submit">저장</button>
    </form>
  </section>
{% endblock %}

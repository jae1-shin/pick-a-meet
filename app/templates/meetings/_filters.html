<div class="meeting-filters">
  <div class="filter-row"><span class="filter-label">동네</span><nav class="filter-chips" aria-label="동네 필터">{% for option in neighborhood_options %}<a class="chip {{ 'active' if option.selected else '' }}" href="{{ option.href }}" aria-pressed="{{ 'true' if option.selected else 'false' }}">{{ option.label }}</a>{% endfor %}{% if selected_neighborhoods %}<a class="clear-filter" href="{{ neighborhood_clear_href }}">필터 해제</a>{% endif %}</nav></div>
  <div class="filter-row"><span class="filter-label">일시</span><nav class="filter-chips" aria-label="일시 필터">{% for option in date_options %}<a class="chip {{ 'active' if option.selected else '' }}" href="{{ option.href }}" aria-pressed="{{ 'true' if option.selected else 'false' }}">{{ option.label }}</a>{% endfor %}{% if selected_dates %}<a class="clear-filter" href="{{ date_clear_href }}">필터 해제</a>{% endif %}</nav></div>
</div>

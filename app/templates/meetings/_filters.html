<div class="meeting-filters">
  <div class="filter-row"><span class="filter-label">동네</span><nav class="filter-chips" aria-label="동네 필터"><a class="chip {{ 'active' if not selected_neighborhoods else '' }}" href="{{ neighborhood_clear_href }}" aria-pressed="{{ 'true' if not selected_neighborhoods else 'false' }}">전체</a>{% for option in neighborhood_options %}<a class="chip {{ 'active' if option.selected else '' }}" href="{{ option.href }}" aria-pressed="{{ 'true' if option.selected else 'false' }}">{{ option.label }}</a>{% endfor %}</nav></div>
  <div class="filter-row"><span class="filter-label">일시</span><nav class="filter-chips" aria-label="일시 필터"><a class="chip {{ 'active' if not selected_dates else '' }}" href="{{ date_clear_href }}" aria-pressed="{{ 'true' if not selected_dates else 'false' }}">전체</a>{% for option in date_options %}<a class="chip {{ 'active' if option.selected else '' }}" href="{{ option.href }}" aria-pressed="{{ 'true' if option.selected else 'false' }}">{{ option.label }}</a>{% endfor %}</nav></div>
  {% if show_availability_filter %}<div class="filter-row"><span class="filter-label">상태</span><nav class="filter-chips" aria-label="신청 상태 필터">{% for option in availability_options %}<a class="chip {{ 'active' if availability_filter == option.value else '' }}" href="{{ option.href }}" data-availability-filter="{{ option.value }}" aria-pressed="{{ 'true' if availability_filter == option.value else 'false' }}">{{ option.label }}</a>{% endfor %}</nav></div>{% endif %}
</div>

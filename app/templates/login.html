{% extends "base.html" %}
{% block title %}로그인 · Pick a Meet{% endblock %}
{% block content %}
  <section class="auth-card card">
    <p class="eyebrow">PICK A MEET</p>
    <h1>로그인</h1>
    <p class="muted">사내 ID와 사번을 입력해주세요.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>ID<input name="login_id" autocomplete="username" required autofocus></label>
      <label>사번<input name="employee_no" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
    </form>
    <details class="demo-accounts">
      <summary>개발용 계정 보기</summary>
      <p>어드민: <code>admin01 / 10000001</code></p>
      <p>리더: <code>leader01 / 10000002</code></p>
      <p>일반: <code>member01 / 10000003</code></p>
    </details>
  </section>
{% endblock %}

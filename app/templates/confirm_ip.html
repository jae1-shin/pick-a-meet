{% extends "base.html" %}
{% block content %}
  <section class="auth-card card">
    <h1>다른 환경에서 로그인</h1>
    <p>이전에 접속한 환경과 다른 환경에서 로그인하고 있습니다.</p>
    {% if last_login_at %}<p class="muted">마지막 로그인: {{ last_login_at }}</p>{% endif %}
    <p>현재 접속이 본인의 접속이 맞습니까?</p>
    <form method="post" action="/login/confirm-ip">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <a class="button secondary" href="/login">취소</a>
      <button type="submit">계속 로그인</button>
    </form>
  </section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Admin 확인 · Pick a Meet{% endblock %}
{% block content %}
  <section class="auth-card card">
    <p class="eyebrow">ADMIN</p>
    <h1>관리자 콘솔 확인</h1>
    <p class="muted">관리 기능을 사용하려면 콘솔 비밀번호를 입력해주세요.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/unlock" class="form-stack">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>콘솔 비밀번호<input name="password" type="password" autocomplete="current-password" required autofocus></label>
      <button type="submit">관리자 콘솔 열기</button>
    </form>
  </section>
{% endblock %}

{% extends "base.html" %}
{% block title %}모임 {{ '수정' if target else '생성' }} · Pick a Meet{% endblock %}
{% block content %}
  <div class="page-heading"><div><p class="eyebrow">ADMIN</p><h1>모임 {{ '수정' if target else '생성' }}</h1></div><a href="/admin/meetings">목록으로</a></div>
  <section class="card form-card">
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="form-stack">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div class="form-grid">
        <label>장소<input name="place_name" value="{{ target.place_name if target else '' }}" required></label>
        <label>장소 바로가기 링크<input name="place_url" type="url" placeholder="https://map.naver.com/..." value="{{ target.place_url if target and target.place_url else '' }}"></label>
        <label>동네<input name="neighborhood" value="{{ target.neighborhood if target else '' }}" placeholder="예: 광교" required></label>
        <label>대표 메뉴<input name="representative_menu" value="{{ target.representative_menu if target else '' }}" required></label>
        <label>시작 일시<input name="start_at" type="datetime-local" value="{{ target.start_at.astimezone(seoul).strftime('%Y-%m-%dT%H:%M') if target else '' }}" required></label>
        <label>종료 일시<input name="end_at" type="datetime-local" value="{{ target.end_at.astimezone(seoul).strftime('%Y-%m-%dT%H:%M') if target else '' }}" required></label>
        <label>정원<input name="capacity" type="number" min="1" value="{{ target.capacity if target else 6 }}" required></label>
        <label>상태<select name="meeting_status">{% for value in ['DRAFT','OPEN','CLOSED','CANCELLED'] %}<option value="{{ value }}" {% if target and target.status == value %}selected{% elif not target and value == 'DRAFT' %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
        <label>Host<select name="host_id" required><option value="">선택</option>{% for host in hosts %}<option value="{{ host.member_id }}" {% if host_id == host.member_id %}selected{% endif %}>{{ host.name }} ({{ host.login_id }})</option>{% endfor %}</select></label>
      </div>
      <label>호스트의 한마디<textarea name="host_message" rows="3" required>{{ target.host_message if target else '' }}</textarea></label>
      <button type="submit">저장</button>
    </form>
  </section>
{% endblock %}
